{% extends 'coreapp/base.html' %}
{% load static %}

{% block title %}Đăng Nhập Hệ Thống | PharmaScan{% endblock %}

{% block content %}
<style>
/* 1. Cấu hình cho toàn bộ khối chữ logo */
.auth-logo-center .logo-text {
    display: inline-block;
    transition: letter-spacing 0.3s ease-in-out !important;
}

/* 2. Cấu hình riêng cho thẻ span chứa chữ 'inter' */
.auth-logo-center .logo-text > span {
    display: inline-block !important;
    transition: transform 0.3s ease-in-out !important;
}

/* ===================================================
   KHI HOVER: ĐẨY DRP SANG TRÁI, ĐẨY INTER SANG PHẢI
   =================================================== */

.auth-logo-center:hover .logo-text {
    /* Đẩy toàn bộ các ký tự (bao gồm DRP) giãn cách nhau ra, DRP tự động lùi sang trái */
    letter-spacing: 10px !important; 
}

.auth-logo-center:hover .logo-text > span {
    /* Chữ inter bị dính hiệu ứng letter-spacing của cha sẽ bị thưa chữ, 
       ta dùng transform để đẩy mạnh nó sang phải và kéo khít chữ 'inter' lại như cũ */
    letter-spacing: normal !important;
    transform: translateX(15px) !important; 
}
/* Tinh chỉnh Input và Nút mắt */
.input-wrapper { position: relative; display: flex; align-items: center; }

.toggle-password-btn {
    position: absolute; right: 12px;
    background: transparent !important;
    border: none !important;
    cursor: pointer;
    color: #94a3b8;
    padding: 5px;
    transition: 0.3s;
}

.toggle-password-btn:hover { color: #3b82f6; }

.alert-error {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 14px;
}   
</style>
<section class="auth-section">
    <div class="container auth-flex-container">
        <div class="auth-card glass-card fade-in">
            <div class="auth-header text-center">
                <a href="{% url 'home' %}" class="logo auth-logo-center">
                    <span class="logo-text">DRP<span >inter</span></span>
                </a>
                <h2 class="auth-title">Chào mừng trở lại!</h2>
                <p class="auth-subtitle">Nhập tài khoản của bạn để truy cập hệ thống</p>
            </div>

            <!-- 1. Sửa thuộc tính form: Đổi thành POST, xóa preventDefault -->
<form id="login-form" class="auth-form" method="POST">
    {% csrf_token %} 

    {% if error_message %}
        <div class="alert-error">{{ error_message }}</div>
    {% endif %}

    <div class="form-group">
        <label for="login-email" class="form-label">Địa chỉ Email <span class="required">*</span></label>
        <div class="input-wrapper">
            <input type="email" id="login-email" name="username" class="form-input" placeholder="ten@pharmascan.com" required>
        </div>
    </div>

    <div class="form-group">
        <div class="label-flex">
            <label for="login-password" class="form-label">Mật Khẩu <span class="required">*</span></label> 
        </div>
        <div class="input-wrapper">
            <input type="password" id="login-password" name="password" class="form-input" placeholder="••••••••" required>
            <button type="button" id="toggle-password" class="toggle-password-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
    </div>

    <div class="form-checkbox-group">
        <input type="checkbox" id="remember-me" name="remember_me" class="form-checkbox">
        <label for="remember-me" class="checkbox-label">Ghi nhớ đăng nhập</label>
    </div>

    <button type="submit" class="btn btn-primary w-full btn-large">
        <span>Đăng Nhập</span>
    </button>
</form>
        </div>
    </div>
</section>
<script>
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('login-password');

    toggleBtn.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.style.color = '#3b82f6'; // Đổi màu khi hiện mật khẩu
        } else {
            passwordInput.type = 'password';
            toggleBtn.style.color = '#94a3b8'; // Trả về màu cũ
        }
    });
</script>
{% endblock %}
